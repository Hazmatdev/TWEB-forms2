<!DOCTYPE html>
<html>
	<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<title>forms2</title>
	</head>
	<body>
		<form id="instituto" action="/instituto" method="post" enctype="multipart/form-data">
		<fieldset>
			<legend>informações de inscrição</legend>
			<label for="nome">Nome completo(obrigatorio)</label>
			<input type="text" id="nome" name="nome" required>
			<label for="matricula">N. de matricula</label>
			<input type="number" id="mat" name="matricula" required><br>
			<label for="data-nascimento">data de nascimento</label>
			<input type="date" id="data-nascimento" name="nascimento" required>
			<label for="naturalidade">Naturalidade</label>
			<input type="text" id="naturalidade" name="naturalidade" required><br>
			<label for="filiacao">Filiação</label>
			<input type="text" id="filiacao" name="filiação" required>
		</fieldset>
	</form>
</body>
</html>
